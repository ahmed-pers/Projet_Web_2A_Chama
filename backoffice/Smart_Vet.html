
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Vet - Back Office</title>
<style>
body{font-family:Arial;background:#f4f6f8;margin:0;color:#263238}
header{background:#246b61;color:white;padding:20px}
.container{padding:25px;max-width:1100px;margin:auto}
section{background:white;padding:20px;margin-bottom:20px;border-radius:8px}
input,select,textarea{padding:10px;margin:5px;border:1px solid #ccc;border-radius:5px}
button{padding:10px;background:#246b61;color:white;border:0;border-radius:5px;cursor:pointer}
.delete{background:#c0392b}
table{width:100%;border-collapse:collapse;margin-top:15px}
td,th{padding:12px;border:1px solid #ddd;text-align:left}
th{background:#e8f3f0}
</style>
</head>
<body>

<header>
<h1>Smart Vet</h1>
<p>Back Office - Administration</p>
</header>

<div class="container">

<section>
<h2>Manage Animals</h2>
<form id="animalForm">
<input type="hidden" id="animalId">
<input id="animalName" placeholder="Animal name" required>
<select id="animalType" required>
<option value="">Choose type</option>
<option>Dog</option><option>Cat</option>
<option>Bird</option><option>Rabbit</option>
<option>Other</option>
</select>
<input id="animalBreed" placeholder="Breed">
<input id="animalAge" type="number" min="0" placeholder="Age">
<input id="ownerName" placeholder="Owner name" required>
<button type="submit">Save Animal</button>
</form>

<table>
<thead>
<tr><th>Name</th><th>Type</th><th>Breed</th><th>Age</th><th>Owner</th><th>Actions</th></tr>
</thead>
<tbody id="animalList"></tbody>
</table>
</section>

<section>
<h2>Manage Appointments</h2>
<form id="appointmentForm">
<input type="hidden" id="appointmentId">
<select id="appointmentAnimal" required></select>
<select id="appointmentVet" required>
<option value="">Choose veterinarian</option>
<option value="Dr. Ahmed">Dr. Ahmed</option>
<option value="Dr. Sami">Dr. Sami</option>
</select>
<input type="date" id="appointmentDate" required>
<input type="time" id="appointmentTime" required>
<input id="appointmentReason" placeholder="Reason">
<select id="appointmentStatus">
<option value="pending">Pending</option>
<option value="confirmed">Confirmed</option>
<option value="done">Done</option>
<option value="cancelled">Cancelled</option>
</select>
<button type="submit">Save Appointment</button>
</form>

<table>
<thead>
<tr><th>Animal</th><th>Veterinarian</th><th>Date</th><th>Time</th><th>Status</th><th>Actions</th></tr>
</thead>
<tbody id="appointmentList"></tbody>
</table>
</section>

</div>

<script>
let animals = JSON.parse(localStorage.getItem("animals") || "[]");
let appointments = JSON.parse(localStorage.getItem("appointments") || "[]");

function saveData(){
localStorage.setItem("animals",JSON.stringify(animals));
localStorage.setItem("appointments",JSON.stringify(appointments));
}

function showAnimals(){
let list=document.getElementById("animalList");
let select=document.getElementById("appointmentAnimal");

list.innerHTML="";
select.innerHTML='<option value="">Choose animal</option>';

animals.forEach(a=>{
list.innerHTML+=`
<tr>
<td>${a.name}</td><td>${a.type}</td>
<td>${a.breed}</td><td>${a.age}</td><td>${a.owner}</td>
<td>
<button onclick="editAnimal(${a.id})">Edit</button>
<button class="delete" onclick="deleteAnimal(${a.id})">Delete</button>
</td></tr>`;

select.innerHTML+=`<option value="${a.id}">${a.name}</option>`;
});
}

document.getElementById("animalForm").onsubmit=function(e){
e.preventDefault();

let id=document.getElementById("animalId").value;

let animal={
id:id ? Number(id) : Date.now(),
name:animalName.value.trim(),
type:animalType.value,
breed:animalBreed.value.trim(),
age:animalAge.value,
owner:ownerName.value.trim()
};

if(!animal.name || !animal.owner || Number(animal.age)<0){
alert("Please check the animal information.");
return;
}

if(id){
animals=animals.map(a=>a.id===Number(id)?animal:a);
}else{
animals.push(animal);
}

saveData();
this.reset();
animalId.value="";
showAnimals();
};

function editAnimal(id){
let a=animals.find(x=>x.id===id);
animalId.value=a.id;
animalName.value=a.name;
animalType.value=a.type;
animalBreed.value=a.breed;
animalAge.value=a.age;
ownerName.value=a.owner;
}

function deleteAnimal(id){
if(confirm("Delete this animal?")){
animals=animals.filter(a=>a.id!==id);
appointments=appointments.filter(a=>a.animalId!==id);
saveData();
showAnimals();
showAppointments();
}
}

function showAppointments(){
let list=document.getElementById("appointmentList");
list.innerHTML="";

appointments.forEach(a=>{
let animal=animals.find(x=>x.id===a.animalId);
list.innerHTML+=`
<tr>
<td>${animal ? animal.name : "Unknown"}</td>
<td>${a.vet}</td><td>${a.date}</td>
<td>${a.time}</td><td>${a.status}</td>
<td>
<button onclick="editAppointment(${a.id})">Edit</button>
<button class="delete" onclick="deleteAppointment(${a.id})">Delete</button>
</td></tr>`;
});
}

document.getElementById("appointmentForm").onsubmit=function(e){
e.preventDefault();

let id=appointmentId.value;
let data={
id:id?Number(id):Date.now(),
animalId:Number(appointmentAnimal.value),
vet:appointmentVet.value,
date:appointmentDate.value,
time:appointmentTime.value,
reason:appointmentReason.value,
status:appointmentStatus.value
};

if(data.date<new Date().toLocaleDateString("en-CA")){
alert("Appointment date cannot be in the past.");
return;
}

let conflict=appointments.some(a=>
a.id!==data.id &&
a.vet===data.vet &&
a.date===data.date &&
a.time===data.time &&
a.status!=="cancelled"
);

if(conflict){
alert("This veterinarian already has an appointment at this time.");
return;
}

if(id){
appointments=appointments.map(a=>a.id===Number(id)?data:a);
}else{
appointments.push(data);
}

saveData();
this.reset();
appointmentId.value="";
showAppointments();
};

function editAppointment(id){
let a=appointments.find(x=>x.id===id);
appointmentId.value=a.id;
appointmentAnimal.value=a.animalId;
appointmentVet.value=a.vet;
appointmentDate.value=a.date;
appointmentTime.value=a.time;
appointmentReason.value=a.reason;
appointmentStatus.value=a.status;
}

function deleteAppointment(id){
if(confirm("Delete this appointment?")){
appointments=appointments.filter(a=>a.id!==id);
saveData();
showAppointments();
}
}

showAnimals();
showAppointments();
</script>
</body>
</html>
