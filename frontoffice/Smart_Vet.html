
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Vet - Front Office</title>
<style>
body{font-family:Arial;background:#f4f6f8;margin:0;color:#263238}
header{background:#246b61;color:white;padding:25px;text-align:center}
.container{max-width:850px;margin:30px auto;padding:20px}
section{background:white;padding:25px;margin-bottom:20px;border-radius:8px}
input,select,textarea{display:block;width:95%;padding:12px;margin:12px 0;border:1px solid #ccc;border-radius:5px}
button{background:#246b61;color:white;border:0;padding:12px 20px;border-radius:5px;cursor:pointer}
.card{background:#e8f3f0;padding:15px;margin:10px 0;border-radius:6px}
</style>
</head>
<body>

<header>
<h1>Smart Vet</h1>
<p>Taking care of your best friend</p>
</header>

<div class="container">

<section>
<h2>Register Your Animal</h2>

<form id="animalForm">
<input id="name" placeholder="Animal name" required>

<select id="type" required>
<option value="">Select animal type</option>
<option>Dog</option><option>Cat</option>
<option>Bird</option><option>Rabbit</option>
<option>Other</option>
</select>

<input id="breed" placeholder="Breed">
<input id="age" type="number" min="0" placeholder="Age">

<input id="owner" placeholder="Your name" required>
<input id="email" type="email" placeholder="Your email">

<button type="submit">Register Animal</button>
</form>
</section>

<section>
<h2>Book an Appointment</h2>

<form id="appointmentForm">
<select id="animal" required>
<option value="">Choose your animal</option>
</select>

<select id="vet" required>
<option value="">Choose veterinarian</option>
<option value="Dr. Ahmed">Dr. Ahmed</option>
<option value="Dr. Sami">Dr. Sami</option>
</select>

<input type="date" id="date" required>
<input type="time" id="time" required>
<textarea id="reason" placeholder="Reason for appointment"></textarea>

<button type="submit">Book Appointment</button>
</form>

<p id="message"></p>
</section>

<section>
<h2>My Appointments</h2>
<div id="myAppointments"></div>
</section>

</div>

<script>
let animals=JSON.parse(localStorage.getItem("animals")||"[]");
let appointments=JSON.parse(localStorage.getItem("appointments")||"[]");

function updateAnimalOptions(){
let select=document.getElementById("animal");
select.innerHTML='<option value="">Choose your animal</option>';

animals.forEach(a=>{
select.innerHTML+=`<option value="${a.id}">${a.name}</option>`;
});
}

document.getElementById("animalForm").onsubmit=function(e){
e.preventDefault();

let animal={
id:Date.now(),
name:name.value.trim(),
type:type.value,
breed:breed.value.trim(),
age:age.value,
owner:owner.value.trim(),
email:email.value.trim()
};

if(!animal.name || !animal.owner || Number(animal.age)<0){
alert("Please check the information.");
return;
}

animals.push(animal);
localStorage.setItem("animals",JSON.stringify(animals));

alert("Your animal has been registered!");
this.reset();
updateAnimalOptions();
};

document.getElementById("appointmentForm").onsubmit=function(e){
e.preventDefault();

let appointment={
id:Date.now(),
animalId:Number(animal.value),
vet:vet.value,
date:date.value,
time:time.value,
reason:reason.value,
status:"pending"
};

let today=new Date().toLocaleDateString("en-CA");

if(appointment.date<today){
alert("Please select a future date.");
return;
}

let conflict=appointments.some(a=>
a.vet===appointment.vet &&
a.date===appointment.date &&
a.time===appointment.time &&
a.status!=="cancelled"
);

if(conflict){
alert("This veterinarian is already booked at this time.");
return;
}

appointments.push(appointment);
localStorage.setItem("appointments",JSON.stringify(appointments));

document.getElementById("message").innerText=
"Your appointment request has been sent successfully!";

this.reset();
showAppointments();
};

function showAppointments(){
let list=document.getElementById("myAppointments");
list.innerHTML="";

appointments.forEach(a=>{
let pet=animals.find(x=>x.id===a.animalId);

if(pet){
list.innerHTML+=`
<div class="card">
<strong>${pet.name}</strong><br>
Veterinarian: ${a.vet}<br>
Date: ${a.date}<br>
Time: ${a.time}<br>
Status: ${a.status}
</div>`;
}
});
}

updateAnimalOptions();
showAppointments();
</script>

</body>
</html>
